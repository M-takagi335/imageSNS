<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ランダム画像フィード</title>
<style>
  :root { --bg:#fff; --ph:#eee; --sub:#888; --text:#222; --line:#ddd; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#000; --ph:#1c1c1c; --sub:#888; --text:#eee; --line:#333; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif; }
  #feed { column-count:2; column-gap:3px; padding:3px; }
  @media (min-width:700px)  { #feed { column-count:3; } }
  @media (min-width:1100px) { #feed { column-count:4; } }
  .photo { display:block; width:100%; margin:0 0 3px; break-inside:avoid; background:var(--ph); }
  .photo img { display:block; width:100%; height:100%; object-fit:cover;
               opacity:0; transition:opacity .4s; }
  .photo img.loaded { opacity:1; }
  #status { text-align:center; color:var(--sub); padding:24px; font-size:14px; }
  #status button { padding:8px 16px; border-radius:8px; border:1px solid var(--line);
                   background:var(--bg); color:var(--text); cursor:pointer; }
</style>
</head>
<body>
<main id="feed"></main>
<div id="status">読み込み中…</div>
<div id="sentinel"></div>

<script>
const API = 'https://commons.wikimedia.org/w/api.php';
const MIN_WIDTH = 800;
const ALLOWED = ['image/jpeg'];
const TARGET_PER_LOAD = 12;
const MAX_TRIES = 6;

const feed = document.getElementById('feed');
const status = document.getElementById('status');
const seen = new Set();
let loading = false;

async function fetchBatch() {
  // 秀逸画像カテゴリ内を、検索のランダムソートで毎回ばらばらに取得
  const params = new URLSearchParams({
    action: 'query', format: 'json', origin: '*',
    generator: 'search',
    gsrsearch: 'incategory:"Featured pictures on Wikimedia Commons"',
    gsrnamespace: '6', gsrsort: 'random', gsrlimit: '50',
    prop: 'imageinfo', iiprop: 'url|size|mime',
    iiurlwidth: '600'
  });
  const res = await fetch(`${API}?${params}`);
  if (!res.ok) throw new Error(res.status);
  const data = await res.json();
  const pages = Object.values((data.query && data.query.pages) || {});
  const items = [];
  for (const p of pages) {
    const info = p.imageinfo && p.imageinfo[0];
    if (!info || !ALLOWED.includes(info.mime)) continue;
    if (info.width < MIN_WIDTH || !info.thumburl) continue;
    if (seen.has(p.pageid)) continue;
    seen.add(p.pageid);
    items.push({
      title: p.title.replace(/^File:/, '').replace(/\.[^.]+$/, '').replace(/_/g, ' '),
      thumb: info.thumburl,
      w: info.thumbwidth, h: info.thumbheight,
      page: info.descriptionurl
    });
  }
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  return items;
}

function addPhoto(item) {
  const link = document.createElement('a');
  link.className = 'photo';
  link.href = item.page;
  link.target = '_blank';
  link.rel = 'noopener noreferrer';
  link.style.aspectRatio = `${item.w} / ${item.h}`;
  const img = document.createElement('img');
  img.loading = 'lazy';
  img.alt = item.title;
  img.src = item.thumb;
  img.onload = () => img.classList.add('loaded');
  img.onerror = () => link.remove();
  link.append(img);
  feed.append(link);
}

async function loadMore() {
  if (loading) return;
  loading = true;
  status.textContent = '読み込み中…';
  try {
    let added = 0;
    for (let i = 0; i < MAX_TRIES && added < TARGET_PER_LOAD; i++) {
      const items = await fetchBatch();
      items.forEach(addPhoto);
      added += items.length;
    }
    status.textContent = '';
  } catch (e) {
    status.innerHTML = '読み込みに失敗しました<br><br><button id="retry">再試行</button>';
    document.getElementById('retry').onclick = () => { loading = false; loadMore(); };
    return;
  }
  loading = false;
  // 監視を張り直す(まだ画面付近にあれば、すぐ次の読み込みが走る)
  io.unobserve(sentinel);
  io.observe(sentinel);
}

const sentinel = document.getElementById('sentinel');
const io = new IntersectionObserver(entries => {
  if (entries[0].isIntersecting) loadMore();
}, { rootMargin: '1500px' });
io.observe(sentinel);
</script>
</body>
</html>
